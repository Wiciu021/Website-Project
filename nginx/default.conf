server {
    listen 80;
    server_name stronaxxlo.pl www.stronaxxlo.pl;

    location / {
        root   /usr/share/nginx/html;
        try_files $uri /index.html;
        index  index.html index.htm;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /default-bucket/ {
        proxy_pass http://minio:9000/default-bucket/;
        proxy_set_header Host minio:9000;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

server {
    listen 80;
    server_name auth.stronaxxlo.pl;

    # Keycloak ma duże headery (tokeny JWT)
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    location / {
        proxy_pass http://keycloak:8080/;

        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   https;     # ← zawsze https, CF terminuje SSL
        proxy_set_header X-Forwarded-Host    $host;
        proxy_set_header X-Forwarded-Port    443;       # ← ważne dla redirect URI

        # WebSocket – Keycloak admin console tego wymaga
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}